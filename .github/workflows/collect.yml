# JobRadar — Scheduled Job Collector
# Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
# Monthly quota: 4 runs/day × 30 days = 120 runs/month (~1.5 min each = ~180 mins/month)
# Comfortably within GitHub Free allowance (2,000 mins/month for private repos; unlimited for public repos).

name: Job Collector

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch & match without storing state or emailing)'
        type: boolean
        default: false
      source:
        description: 'Run only this adapter (SOURCE_ID, e.g. remoteok, remotive, or leave empty for all)'
        type: string
        default: ''

# Prevent concurrent collector runs from corrupting job_state.json or causing push conflicts
concurrency:
  group: jobradar-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect & Alert Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Minimum permissions needed: write repository contents to commit updated job_state.json
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history or at least latest commit on default branch for clean rebases
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        env:
          STATE_FILE_PATH: 'data/job_state.json'
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_POSTING_AGE_HOURS: ${{ vars.MAX_POSTING_AGE_HOURS || '24' }}
          MIN_MATCH_SCORE: ${{ vars.MIN_MATCH_SCORE || '40' }}
          NOTIFICATION_MIN_SCORE: ${{ vars.NOTIFICATION_MIN_SCORE || '50' }}
          MAX_JOBS_PER_SOURCE: ${{ vars.MAX_JOBS_PER_SOURCE || '100' }}
          REQUEST_TIMEOUT: '30'
          REQUEST_DELAY_SECONDS: '2'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN MODE — no state or emails will be saved"
            python scripts/run_collector.py --dry-run ${{ inputs.source && format('--source {0}', inputs.source) || '' }}
          else
            python -m backend.collector
          fi

      - name: Commit and push updated job state
        if: success() && inputs.dry_run != true
        run: |
          # Only commit if data/job_state.json actually changed
          if git diff --quiet data/job_state.json; then
            echo "No changes detected in data/job_state.json. Skipping commit."
          else
            echo "Changes detected in data/job_state.json. Committing state update..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/job_state.json
            git commit -m "chore(data): update job state [skip ci]"

            # Safe push with rebase retry to avoid conflicts
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || {
                echo "Push conflict, retrying in 3s ($i/3)..."
                sleep 3
              }
            done
          fi
