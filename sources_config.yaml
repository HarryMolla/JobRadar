# --- Greenhouse companies ---
# Find board token from: https://boards.greenhouse.io/{token}
greenhouse_boards:
  - token: "shopify"
    company: "Shopify"
  - token: "atlassian"
    company: "Atlassian"
  - token: "canva"
    company: "Canva"
  - token: "hubspot"
    company: "HubSpot"
  - token: "zapier"
    company: "Zapier"
  - token: "intercom"
    company: "Intercom"
  - token: "gitlab"
    company: "GitLab"
  - token: "buffer"
    company: "Buffer"

